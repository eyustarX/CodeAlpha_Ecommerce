<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Alpha Store</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-card {
      max-width: 440px;
      margin: 3rem auto;
      background: var(--surface);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
    }
    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
    }
    .demo-credentials {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius);
      padding: 0.75rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">Alpha Store</a>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="register.html">Register</a>
    </div>
  </nav>

  <main class="container">
    <div class="auth-card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome to Alpha Store</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem;">Sign in to your account</p>

      <div id="error-box" class="alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 0.8rem; font-size: 1rem;">Sign In</button>
      </form>

      <div class="demo-credentials">
        <strong>Demo Accounts (Pre-seeded):</strong><br>
        • Customer: <code>customer@alphastore.com</code> / <code>customer123</code><br>
        • Admin: <code>admin@alphastore.com</code> / <code>admin123</code>
      </div>

      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
      </p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await api.post('/auth/login', { email, password });
        auth.setAuth(response.data.token, response.data.user);
        
        // Redirect to admin panel if user is admin, else catalog
        if (response.data.user.role === 'ADMIN') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
