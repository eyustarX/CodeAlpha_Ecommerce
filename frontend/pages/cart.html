<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Alpha Store</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      align-items: start;
    }
    .cart-items-card, .cart-summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .cart-item-row {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item-row:last-child {
      border-bottom: none;
    }
    .cart-item-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: var(--radius);
    }
    .cart-item-details {
      flex: 1;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
    }
    .remove-btn {
      color: var(--danger);
      background: none;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.4rem;
      display: block;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .summary-total {
      font-size: 1.3rem;
      font-weight: 700;
      border-top: 2px solid var(--border);
      padding-top: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 768px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">Alpha Store</a>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="orders.html">My Orders</a>
      <a href="cart.html">Cart <span id="cart-count" class="badge">0</span></a>
      <span id="admin-link-container"></span>
      <a href="login.html" id="auth-link">Login</a>
    </div>
  </nav>

  <main class="container">
    <h1 style="margin-bottom: 1.5rem;">Your Shopping Cart</h1>

    <div id="cart-content">
      <p style="text-align: center;">Loading your cart...</p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
